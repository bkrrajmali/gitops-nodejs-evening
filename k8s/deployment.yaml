apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  labels:
    app: nodejs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
        - name: nodejs-app
          image: bkrrajmali/blue-blueberry:v2
          imagePullPolicy: IfNotPresent   # use the image loaded into the cluster
          ports:
            - containerPort: 80
          env:
            - name: APP_MESSAGE
              value: "Hello from GitOps!"