apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  labels:
    app: nodejs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
        - name: nodejs-app
          image: nodejs-gitops:v1
          imagePullPolicy: IfNotPresent   # use the image loaded into the cluster
          ports:
            - containerPort: 3000
          env:
            - name: APP_MESSAGE
              value: "Hello from GitOps!"